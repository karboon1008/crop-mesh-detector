# Configuration for the crop-type / crop-disease mesh simulation.
# Every value here is read by src/config.py — change experiments from this
# file rather than editing code.

data:
  root: "data/PlantVillage"       # PlantVillage is the only dataset
  image_size: 224
  # Which PlantVillage class folders to use (delete this list to use all 38).
  # Tomato only: 4 diseases + healthy, ~8,400 images.
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  num_nodes: 2                    # simulated farms
  probe_set_fraction: 0.05        # share of EACH batch carved (stratified) into that batch's public probe set (not cumulative)
  # the three probe_set_* keys below only apply to the scenarios' static split (src/scenarios/)
  probe_set_large_class_threshold: 200
  probe_set_min_samples_small_class: 10
  probe_set_max_fraction_small_class: 0.2
  test_fraction: 0.15             # private test share of each node's arrivals in EACH batch (train gets 0.85), stratified per class
  non_iid_strategy: "manual_classes"  # "manual_classes" | "farm_crops" | "by_crop" | "by_disease" | "dirichlet" | "manual"
  # Only used when non_iid_strategy == "manual_classes": the class folders
  # each farm photographs. A class listed for several farms is split evenly
  # between them. Healthy leaves on both farms; each disease on one farm
  # only, so each farm's early-warning test is the other farm's diseases.
  manual_node_classes:
    node_0: [Tomato___healthy, Tomato___Bacterial_spot, Tomato___Early_blight]
    node_1: [Tomato___healthy, Tomato___Late_blight, Tomato___Septoria_leaf_spot]
  dirichlet_alpha: 0.5            # only used by "dirichlet"
  # Only used when non_iid_strategy == "farm_crops": each crop is grown by
  # growers_per_crop farms. Every grower sees that crop's healthy leaves; each
  # disease has so far reached only disease_spread of its growers (at least
  # one grower is always still waiting for it) — the diseases a farm could
  # learn from a peer before they arrive.
  farm_crops:
    growers_per_crop: 2           # 14 crops x 2 / 6 farms ~ 4-5 crops per farm
    disease_spread: 0.5
  # Early-warning test (simulation only): for each farm, held-out photos of
  # diseases on ITS crops that only other farms have. Tested before and after
  # distillation, never trained on, never used for the EMA/roles, and its
  # energy is reported separately (a real farm wouldn't run it).
  early_warning:
    enabled: true
    holdout_fraction: 0.1         # share of each such disease's photos held out of every farm's data
    max_images_per_class: 200     # cap per disease per farm, to keep the extra test cheap (tomato: ~all held-out photos)
  # Only used when non_iid_strategy == "manual" — one crop species per node
  # (all of that crop's disease classes included), so each simulated farm
  # specializes in a single crop.
  manual_node_crops:
    node_0: ["Apple"]
    node_1: ["Corn"]
    node_2: ["Grape"]
    node_3: ["Pepper,_bell"]
    node_4: ["Potato"]
    node_5: ["Tomato"]
  seed: 42

# Continual testing (src/train.py -> src/data/stream.py + src/federated/continual.py).
# Every image is assigned to the node that "owns" it (non-IID). Batches then
# arrive one per trigger, each a STRATIFIED sample (every class in proportion)
# of the images no earlier batch used:
#   python -m src.train               -> batch 0: first_batch_size images
#   python -m src.train --next-batch  -> next_batch_size more images, run on top of the saved models
# Of each batch, data.probe_set_fraction (5%) goes to the shared probe set and
# the rest to the owning nodes, which split it train/test (data.test_fraction).
continual:
  # scaled to the ~7,700 tomato images left after the early-warning holdout:
  # batch 0 ~40%, then ~9 later rounds (use 20000 / 3000 with all 38 classes)
  first_batch_size: 3000          # images in batch 0, all nodes combined
  next_batch_size: 500            # images per --next-batch trigger, all nodes combined
  # Semi-supervised ("self-learning") later batches: field photos mostly
  # arrive without labels. Of each node's train images, only this share keep
  # their labels (stratified, every class keeps >= 1); the rest are
  # pseudo-labelled by the node itself. Test images always keep labels.
  first_batch_labeled_fraction: 1.0   # batch 0: the initial, fully labelled deployment set
  labeled_fraction: 0.1               # every --next-batch
  pseudo_label_threshold: 0.95        # softmax confidence needed to trust a pseudo-label (per head)
  pseudo_label_prototype_check: true  # during distillation, also require the nearest peer consensus prototype to agree
  unlabeled_weight: 1.0               # weight of the pseudo-label loss next to the labelled sup_loss
  unlabeled_batch_ratio: 7            # unlabelled images per labelled image in each training step
  first_batch_local_epochs: 5     # batch 0 starts from ImageNet weights, so it gets more epochs; later batches use training.local_epochs_per_round(+overrides)
  ema_metric: "pair_accuracy"     # pre-distill metric the EMA tracks: pair_accuracy | crop_accuracy | disease_accuracy
  ema_alpha: 0.3                  # EMA_t = alpha * metric_t + (1 - alpha) * EMA_(t-1)
  ema_threshold: 0.8              # later batches: EMA < threshold -> learner (retrieve + distil); EMA rose vs. last batch -> teacher (upload)

models:
  # any subset of: mobilenet_v3_small, efficientnet_lite0, mobilevit_xxs
  architectures:
    - mobilenet_v3_small
    - efficientnet_lite0
    - mobilevit_xxs
  pretrained: true

training:
  local_epochs_per_round: 2       # local training epochs before each exchange round (default; per-arch overrides below)
  # mobilenet_v3_small and mobilevit_xxs show large pre-distill accuracy
  # swings round-to-round (~0.15-0.18) vs. efficientnet_lite0's ~0.009 —
  # one extra local epoch lets the lower-capacity models re-consolidate
  # before each distillation step. efficientnet_lite0 is already stable
  # and near the accuracy ceiling, so it stays at the default of 2.
  local_epochs_per_round_overrides:
    mobilenet_v3_small: 3
    mobilevit_xxs: 3
  # Freezes the backbone stem + first two feature stages (generic,
  # ImageNet-transferable low-level features) during mesh training — an experiment to reduce the round-to-round swings
  # above by cutting how much of the backbone a node's short 2-3 epoch
  # local fine-tune can reshape each round. Only affects
  # mobilenet_v3_small/mobilevit_xxs (see FREEZE_LOW_LAYER_PREFIXES in
  # src/models/factory.py); efficientnet_lite0 has no entry there and is
  # always a no-op, matching the reasoning above.
  freeze_low_layers_in_mesh: false
  # Scenarios only (src/scenarios/): folds local supervised training +
  # prototype-alignment + both KD losses into ONE combined-loss phase per
  # round. The continual pipeline (src/train.py) always runs local training
  # and distillation as separate steps, so it ignores this.
  combined_training: true
  distill_epochs_per_round: 2     # epochs spent distilling towards consensus knowledge (each learner, each batch)
  crop_loss_weight: 1.0
  disease_loss_weight: 1.5        # upweights disease cross-entropy relative to crop
  loss_type: "cross_entropy"      # "cross_entropy" | "focal" — focal down-weights already-confident (majority-class) examples
  focal_gamma: 2.0                # focusing parameter for focal loss (only used when loss_type == "focal")
  crop_class_balanced: true      # inverse-frequency per-class weights within the crop loss (see compute_crop_class_weights)
  disease_class_balanced: true    # inverse-frequency per-class weights within the disease loss (see compute_disease_class_weights)
  max_epochs_per_node: 40         # cap on the size-scaled epoch count (see scale_epochs_by_node_size) for small nodes
  batch_size: 32
  lr: 0.001
  distill_lr: 0.0005
  proto_weight: 0.15               # weight of prototype-alignment loss during distillation
  kd_weight: 0.7                  # weight of disease-logit distillation (KD) loss during distillation — raised from 0.4 so cross-node consensus can outweigh each round's local retraining
  crop_kd_weight: 0.7              # weight of crop-logit distillation loss, tuned separately from kd_weight — enabled now that non_iid_strategy=dirichlet gives peers overlapping (not exclusive) crop coverage, so a per-node known-crop-classes mask can safely aggregate cross-node crop-logit consensus the same way disease logits already do; omit/null to fall back to kd_weight
  kd_temperature: 1.5
  adaptive_kd_weight: true        # scenarios only: if true, scale kd_weight per node each round by (peer pre-round avg accuracy / this node's pre-round avg accuracy), so nodes already ahead of their peers get pulled less toward consensus and nodes behind get pulled harder, instead of every node absorbing the same flat kd_weight
  adaptive_kd_min_scale: 0.3       # floor on the per-node scale factor above (only used when adaptive_kd_weight is true)
  adaptive_kd_max_scale: 1.5       # ceiling on the per-node scale factor above (only used when adaptive_kd_weight is true)

federated:
  aggregation: "trimmed_mean"     # "trimmed_mean" | "krum"
  trim_fraction: 0.2               # fraction trimmed from each end (trimmed_mean only) — with num_nodes=6, each node has only 5 peers, and _trimmed_mean's k = int(n * trim_fraction) needs trim_fraction >= 0.2 to ever trim anyone at n=5; 0.15 was silently a no-op (plain mean, zero robustness). Crop- and disease-logit aggregation now pre-filter to peers with real local support for each class before this trimming runs (see aggregate_masked_logits in src/federated/aggregation.py), so this only trims among already-informed peers — it protects prototype aggregation against one stale/corrupted peer without the old risk of trimming away the lone informed peer's signal
  krum_neighbors: 2               # number of closest peers kept (krum only)

energy:
  track_with_codecarbon: true
  country_iso_code: "GBR"          # Isambard is in Bristol, UK 
  grid_carbon_intensity_gco2_per_kwh: 125   # National Grid ESO 2024 GB average
  fallback_power_watts: 15.0
  # Rough per-byte transmit energy budgets (Joules/byte), used ONLY for the
  # communication-energy estimate — swap for measured figures if available.
  radio_energy_j_per_byte:
    wifi: 0.00003
    cellular_lte: 0.0003
    lora: 0.00012

output:
  dir: "outputs"
  save_plots: true

# Edge deployment (src/edge/): one knowledge server for the co-op, one node
# agent per farm device, and — in simulation — a feeder playing the cameras.
edge:
  dir: "edge_run"                     # inboxes, stream.json and each farm's local state
  server_url: "http://localhost:8000" # the knowledge server (python -m src.edge.server)
  architecture: mobilenet_v3_small    # the model each farm's agent runs
  round_timeout_s: 1800               # a learner waits at most this long for the other farms' logits
  poll_interval_s: 10                 # how often an agent checks the server for uploads / new rounds
  export_onnx: true                   # re-export model.onnx for the camera app after every round

scenarios:
  rounds: 6
  disconnection:
    target_node: "node_1"
    disconnect_round: 2
    reconnect_round: 4
  class_addition:
    target_node: "node_0"
    source_crop: "Tomato"       # at least one node OTHER than target_node must hold this crop, so the mesh has a teacher
    inject_round: 2
    # "auto" | "target_withheld" | "peer_reserve" -- how the "new" class is
    # produced (see src/scenarios/class_addition.py). "auto" withholds the
    # target's own source_crop samples until inject_round when it has any
    # (the case under an overlapping partition such as dirichlet, where the
    # target would otherwise already know every crop and there would be no
    # new class to add), and otherwise carves a slice out of the teacher
    # peer's shard (the case under a disjoint partition such as manual).
    injection_source: "auto"
    reserve_fraction: 0.3       # peer_reserve mode only: fraction of the teacher peer's source_crop images injected
  distribution_shift:
    target_node: "node_2"
    shift_round: 2
    corruption: "brightness_blur_noise"
    severity: 0.5

docker_mesh:
  # node_2's shard (Tomato-heavy, per manual_node_crops) is ~3x node_0's and
  # ~2x node_1's batch count. Measured: node_2's /round/start (1 local
  # epoch + compute_knowledge) took ~4330s under 3-way CPU contention on a
  # 16-core host -- comfortably over the old 300s/3600s values. Originally
  # sized here for roughly double that (to cover local_epochs_per_round/
  # distill_epochs_per_round going from 1 back to their original 2) plus
  # safety margin, since round_timeout_s is the per-HTTP-call timeout for
  # BOTH /round/start and /round/gather.
  #
  # STALE MARGIN NOTE: since that measurement, the shadow-model task made
  # /round/start also run a full shadow (local_only) arm -- its own
  # local_train + evaluate -- sequentially BEFORE the existing mesh arm,
  # roughly doubling /round/start's per-call cost again on top of the
  # headroom above. 21600 still numerically covers a reasonable worst case
  # today, but the actual safety margin it provides is now much smaller
  # than the "roughly double" framing above implies. Re-measure
  # /round/start (shadow arm + mesh arm) and revisit this value before
  # restoring local_epochs_per_round/distill_epochs_per_round from their
  # current "TEMP: reduced for smoke run" values back to non-smoke-test
  # settings.
  round_timeout_s: 43200
  data_dir: "data/docker_mesh"
  energy_db_dir: "outputs/docker_mesh/energy"
  dashboard_refresh_s: 3

corn_mesh:
  crop: "Corn"
  node_diseases:
    node_0: "Common_rust"
    node_1: "Cercospora_leaf_spot Gray_leaf_spot"
    node_2: "Northern_Leaf_Blight"
  healthy_dedup_threshold: 5
  rounds: 2
  output_dir: "outputs/validation/corn_mesh"
