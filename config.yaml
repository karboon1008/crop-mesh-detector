# Configuration for the crop-type / crop-disease mesh simulation.
# Every value here is read by src/config.py — change experiments from this
# file rather than editing code.

data:
  root: "data/PlantVillage"      # expects class-per-folder images, e.g. "Tomato___Bacterial_spot"
  image_size: 160
  num_nodes: 3                    # simulated farms
  probe_set_fraction: 0.05
  probe_set_large_class_threshold: 200
  probe_set_min_samples_small_class: 8
  probe_set_max_fraction_small_class: 0.2
  test_fraction: 0.15             # per-node held-out test split (used for accuracy + collaboration gain)
  non_iid_strategy: "manual"      # "by_crop" | "by_disease" | "dirichlet" | "manual"
  dirichlet_alpha: 0.3            # only used when non_iid_strategy == "dirichlet"
  # Only used when non_iid_strategy == "manual" — thematically-coherent
  # farm-type split (volume-imbalanced by design: node_2 covers fewer,
  # higher-yield greenhouse crops than the other two).
  manual_node_crops:
    node_0: ["Apple", "Cherry", "Peach", "Blueberry", "Raspberry"]        # "orchard farm" — tree/bush fruit
    node_1: ["Corn", "Potato", "Soybean", "Strawberry", "Squash"]         # "field-crop farm" — broadacre/row crops
    node_2: ["Tomato", "Pepper,_bell", "Grape", "Orange"]                 # "greenhouse/market-garden farm" — warm-climate produce
  seed: 42

models:
  # any subset of: mobilenet_v3_small, efficientnet_lite0, mobilevit_xxs
  architectures:
    - mobilenet_v3_small
    - efficientnet_lite0
    - mobilevit_xxs
  pretrained: true

training:
  local_epochs_per_round: 1       # local training epochs before each exchange round -- TEMP: reduced from 2 for smoke run
  distill_epochs_per_round: 1     # epochs spent distilling towards consensus knowledge
  rounds: 1                       # number of mesh exchange rounds -- TEMP: reduced from 5 for smoke run
  baseline_epochs: 1              # epochs for the local-only baseline (aligned compute budget) -- TEMP: reduced from 10 for smoke run
  batch_size: 32
  lr: 0.001
  distill_lr: 0.0005
  proto_weight: 0.5               # weight of prototype-alignment loss during distillation
  kd_weight: 0.5                  # weight of logit-distillation (KD) loss during distillation
  kd_temperature: 2.0

federated:
  aggregation: "trimmed_mean"     # "trimmed_mean" | "krum"
  trim_fraction: 0.2              # fraction trimmed from each end (trimmed_mean only)
  krum_neighbors: 2               # number of closest peers kept (krum only)

energy:
  track_with_codecarbon: false # set true if allow to track powermetrics
  country_iso_code: "GBR"
  grid_carbon_intensity_gco2_per_kwh: 125   # National Grid ESO 2024 GB average
  # Rough per-byte transmit energy budgets (Joules/byte), used ONLY for the
  # communication-energy estimate — swap for measured figures if available.
  radio_energy_j_per_byte:
    wifi: 0.00003
    cellular_lte: 0.0003
    lora: 0.00012

output:
  dir: "outputs"
  save_plots: true

scenarios:
  rounds: 6
  disconnection:
    target_node: "node_1"
    disconnect_round: 2
    reconnect_round: 4
  class_addition:
    target_node: "node_0"
    source_crop: "Tomato"       # must belong to a different node in manual_node_crops (currently node_2)
    inject_round: 2
    reserve_fraction: 0.3
  distribution_shift:
    target_node: "node_2"
    shift_round: 2
    corruption: "brightness_blur_noise"
    severity: 0.5

docker_mesh:
  # node_2's shard (Tomato-heavy, per manual_node_crops) is ~3x node_0's and
  # ~2x node_1's batch count. Measured: node_2's /round/start (1 local
  # epoch + compute_knowledge) took ~4330s under 3-way CPU contention on a
  # 16-core host -- comfortably over the old 300s/3600s values. Sized here
  # for roughly double that (to cover local_epochs_per_round/
  # distill_epochs_per_round going from 1 back to their original 2) plus
  # safety margin, since round_timeout_s is the per-HTTP-call timeout for
  # BOTH /round/start and /round/gather.
  round_timeout_s: 21600
  data_dir: "data/docker_mesh"
  energy_db_dir: "outputs/docker_mesh/energy"
  dashboard_refresh_s: 3
