data:
  root: data/PlantVillage
  extra_sources:
    plantdoc:
    - data/PlantDoc
    plantwild:
    - data/PlantWild
  included_crops: auto
  auto_crop_count: 2
  auto_crop_min_diseases: 2
  auto_crop_node_groups:
  - - node_0
  - - node_1
  image_size: 224
  num_nodes: 2
  probe_set_fraction: 0.05
  probe_set_large_class_threshold: 200
  probe_set_min_samples_small_class: 10
  probe_set_max_fraction_small_class: 0.2
  test_fraction: 0.15
  non_iid_strategy: dirichlet_by_crop
  dirichlet_alpha: 0.5
  manual_node_crops:
    node_0:
    - Corn
    node_1:
    - Corn
    node_2:
    - Apple
    node_3:
    - Apple
  seed: 42
continual:
  first_batch_size: 4000
  next_batch_size: 1000
  first_batch_local_epochs: 5
  ema_metric: pair_accuracy
  ema_alpha: 0.3
  ema_threshold: 0.8
models:
  architectures:
  - mobilenet_v3_small
  - efficientnet_lite0
  - mobilevit_xxs
  pretrained: true
training:
  local_epochs_per_round: 2
  local_epochs_per_round_overrides:
    mobilenet_v3_small: 3
    mobilevit_xxs: 3
  freeze_low_layers_in_mesh: false
  combined_training: true
  distill_epochs_per_round: 2
  crop_loss_weight: 1.0
  disease_loss_weight: 1.5
  loss_type: cross_entropy
  focal_gamma: 2.0
  crop_class_balanced: true
  disease_class_balanced: true
  max_epochs_per_node: 40
  batch_size: 32
  lr: 0.001
  distill_lr: 0.0005
  proto_weight: 0.15
  kd_weight: 0.7
  crop_kd_weight: 0.7
  kd_temperature: 1.5
  adaptive_kd_weight: true
  adaptive_kd_min_scale: 0.3
  adaptive_kd_max_scale: 1.5
  round_lr: 0.0005
federated:
  aggregation: trimmed_mean
  trim_fraction: 0.2
  krum_neighbors: 2
energy:
  track_with_codecarbon: true
  country_iso_code: GBR
  grid_carbon_intensity_gco2_per_kwh: 125
  fallback_power_watts: 15.0
  radio_energy_j_per_byte:
    wifi: 3.0e-05
    cellular_lte: 0.0003
    lora: 0.00012
output:
  dir: outputs
  save_plots: true
scenarios:
  rounds: 6
  disconnection:
    target_node: node_1
    disconnect_round: 2
    reconnect_round: 4
  class_addition:
    target_node: node_0
    source_crop: Apple
    inject_round: 2
    injection_source: auto
    reserve_fraction: 0.3
  distribution_shift:
    target_node: node_2
    shift_round: 2
    corruption: brightness_blur_noise
    severity: 0.5
docker_mesh:
  round_timeout_s: 43200
  data_dir: data/docker_mesh
  energy_db_dir: outputs/docker_mesh/energy
  dashboard_refresh_s: 3
corn_mesh:
  crop: Corn
  node_diseases:
    node_0: Common_rust
    node_1: Cercospora_leaf_spot Gray_leaf_spot
    node_2: Northern_Leaf_Blight
  healthy_dedup_threshold: 5
  rounds: 2
  output_dir: outputs/validation/corn_mesh
